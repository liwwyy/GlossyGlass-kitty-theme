# GlossyGlass - dark glass, soft red, plain text.
shell fish
font_family Adwaita Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 12.5
disable_ligatures always

# Near-black glass. Blur requires compositor support.
background_opacity 0.90
dynamic_background_opacity yes
background_blur 24
window_padding_width 16
window_margin_width 0
window_border_width 1
active_border_color #e9a0a7
inactive_border_color #30272b
hide_window_decorations no

cursor #f2b0b7
cursor_text_color #0b090b
cursor_shape beam
# Gentle fade and a short trail when moving between positions.
cursor_blink_interval 0.65 ease-in-out
cursor_stop_blinking_after 15
cursor_trail 1
cursor_trail_decay 0.06 0.14
cursor_trail_start_threshold 1
custom_shaders cursor-trail-motion-blur
# Smooth terminal scrollback; applications manage their own scrolling.
pixel_scroll yes
momentum_scroll 0.96
map ctrl+shift+up scroll_line_up smooth
map ctrl+shift+down scroll_line_down smooth
map ctrl+shift+page_up scroll_page_up smooth
map ctrl+shift+page_down scroll_page_down smooth
repaint_delay 8
input_delay 1
scrollback_lines 10000
enable_audio_bell no
visual_bell_duration 0
bell_on_tab no

# Simple tabs without icons, arrows, or powerline glyphs.
tab_bar_style separator
tab_separator " | "
tab_bar_min_tabs 2
tab_title_template "{index}: {title}"
active_tab_foreground #f4dfe1
active_tab_background #302127
inactive_tab_foreground #bfaeb4
inactive_tab_background #100d10
active_tab_font_style bold
inactive_tab_font_style normal

include theme.conf
